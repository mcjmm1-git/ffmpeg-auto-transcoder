###############################################################################
# USER CONFIGURATION
#
# Before running "docker compose up -d", update the values marked with:
# <<< CHANGE
###############################################################################

###############################################################################
# Media library locations on the host
# <<< CHANGE
###############################################################################
x-media-paths:
  dd2: &media_dd2 "/mnt/dd2"
  dd1: &media_dd1 "/mnt/dd1"
  dd3: &media_dd3 "/mnt/dd3"
  elements: &media_elements "/mnt/elements"

###############################################################################
# Input directory inside the containers
#
# All source videos enter through elements.
# Logs, progress and completed originals also use this disk.
###############################################################################
x-media-dirs: &media_dirs "/media/elements"

###############################################################################
# Output directories inside the containers
#
# Transcoded files may only be stored on these disks.
###############################################################################
x-output-media-dirs: &output_media_dirs "/media/dd1:/media/dd2:/media/dd3"

###############################################################################
# Application time zone
#
# Use an IANA time zone such as Europe/Madrid, America/New_York or UTC.
# This value is used by both containers and by the monitor finish-time display.
# <<< CHANGE
###############################################################################
x-time-zone: &time_zone "Europe/Madrid"

services:
  ffmpeg-auto-transcoder:
    container_name: ffmpeg-auto-transcoder

    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    ############################################################################
    # User and group IDs
    #
    # Run "id" on the host and replace both numbers with your UID and GID.
    # <<< CHANGE
    ############################################################################
    user: "1000:1000"

    environment:

      ##########################################################################
      # Media libraries inside the container.
      #
      # Use colon-separated paths. Their order must match the intended scan
      # order. The first path also stores shared monitor state and logs.
      ##########################################################################
      MEDIA_DIRS: *media_dirs
      OUTPUT_MEDIA_DIRS: *output_media_dirs

      ##########################################################################
      # Application time zone.
      #
      # Both variables are intentionally provided for compatibility with the
      # container, configuration loader and monitor.
      ##########################################################################
      TZ: *time_zone
      TIMEZONE: *time_zone

      ##########################################################################
      # Minimum free space that must remain on an output disk.
      # <<< CHANGE
      ##########################################################################
      MIN_FREE_GB: 30

      ##########################################################################
      # Additional estimated space for copied audio and size variations.
      # <<< CHANGE
      ##########################################################################
      OUTPUT_SPACE_MARGIN_GB: 5

      ##########################################################################
      # Target movie size (GB)
      #
      # Recommended Full HD profile for a large projector screen:
      # approximately 16 GB for a 150-minute movie.
      # Increase for higher quality or reduce to save disk space.
      # <<< CHANGE
      ##########################################################################
      TARGET_GB: 20

      ##########################################################################
      # Reference duration used for dynamic bitrate calculation (minutes)
      # <<< CHANGE
      ##########################################################################
      TARGET_MIN: 150

      ##########################################################################
      # Minimum video bitrate (bits per second)
      #
      # 12000000 = 12 Mbps.
      # Recommended for Full HD projection on a large screen.
      # <<< CHANGE
      ##########################################################################
      MIN_VIDEO_BPS: 8000000

      ##########################################################################
      # Output resolution
      #
      # 7680 x 4320 = 8K UHD
      # 3840 x 2160 = 4K UHD
      # 2560 x 1440 = 1440p
      # 1920 x 1080 = Full HD
      # 1280 x 720  = HD
      #
      # <<< CHANGE
      ##########################################################################
      TARGET_W: 3840
      TARGET_H: 2160

      ##########################################################################
      # API keys
      #
      # Get your personal API keys from:
      # https://www.themoviedb.org/settings/api
      # https://www.omdbapi.com/apikey.aspx
      #
      # Never commit real API keys to a public repository.
      # <<< CHANGE
      ##########################################################################
      TMDB_API_KEY: ""
      OMDB_API_KEY: ""

    volumes:
      - type: bind
        source: *media_dd2
        target: /media/dd2

      - type: bind
        source: *media_dd1
        target: /media/dd1

      - type: bind
        source: *media_dd3
        target: /media/dd3

      - type: bind
        source: *media_elements
        target: /media/elements

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

  ffmpeg-monitor:
    container_name: ffmpeg-monitor

    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile

    restart: unless-stopped

    depends_on:
      - ffmpeg-auto-transcoder

    # Share the transcoder PID namespace so monitor.sh can detect its process.
    pid: "service:ffmpeg-auto-transcoder"

    command:
      - ttyd
      - "-W"
      - "-p"
      - "7681"
      - "./monitor.sh"

    environment:

      ##########################################################################
      # Use the same media and time-zone configuration as the transcoder.
      ##########################################################################
      MEDIA_DIRS: *media_dirs
      OUTPUT_MEDIA_DIRS: *output_media_dirs
      TZ: *time_zone
      TIMEZONE: *time_zone

    ############################################################################
    # Web monitor port
    #
    # Change only if port 9002 is already in use.
    # Change only the number on the left.
    # <<< CHANGE
    ############################################################################
    ports:
      - "9002:7681"

    volumes:
      - type: bind
        source: *media_dd2
        target: /media/dd2

      - type: bind
        source: *media_dd1
        target: /media/dd1

      - type: bind
        source: *media_dd3
        target: /media/dd3

      - type: bind
        source: *media_elements
        target: /media/elements

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
